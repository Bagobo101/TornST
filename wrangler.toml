[[kv_namespaces]]
binding = "BACKGROUND_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_ORIGIN = "https://tornstockalert.duckdns.org"
VAPID_SUBJECT = "mailto:replace-with-your-email@example.com"